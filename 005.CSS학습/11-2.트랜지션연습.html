<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>트랜지션 연습</title>
    <style>
      /* css코드 구역 */
      html,
      body {
        height: 100%;
      }

      body {
        background-image: linear-gradient(
          to bottom,
          #1688c1,
          #2c0a0a 10%,
          #118840 70%
        );
      }
      /* 애니박스 */
      .ani-box {
        /* 부모자격 */
        position: relative;
        /* 비율박스설정 */
        top: 10%;
        padding-top: 30%;

        outline: 2px dotted rgb(141, 10, 27);
        /* 자식요소 숨기기 */
        overflow: hidden;
      }
      /* 자동차박스 */
      #car-box {
        position: absolute;
        /* 자동차 나가있음 */
        left: -50%;
        bottom: 11%;
        width: 40%;
        /* width의 %값은 부모요소의 width 대한 비율이다 */
        z-index: 1;
        /* 높이값이 없는 박스에서 패딩탑값이 %면 본 박스의
        width크기에 대한 %비율이다!! */
        padding-top: 11%;
        /* height: 300px; 
        -> height 하면 고정이 되어버린다.*/
        /* 자동차 배경이미지 
        -> 배경이미지는 css에서 변경가능하기때문에
        이미지 요소 대신 박스배경을 사용한다.*/
        background: url(./images/car.png) no-repeat 0/100%;
      }
      /* 바트박스 */
      #bart-box {
        position: absolute;
        bottom: 10%;
        left: 50%;
        width: 13%;
      }
      /* 바트이미지 */
      #bart-box img {
        width: 100%;
      }
      /* 라벨 디자인 - 버튼형 */
      .btn-action {
        /* 위,아래,마진,보더 등 적용위헤 */
        padding: 20px;
        border: 5px solid rgb(227, 53, 155);
        border-radius: 10px;
        background-color: #eba0d6;
        margin-top: 20px;
        display: inline-block;
        /* 손가락모양 */
        cursor: pointer;
      }
      /* 가상요소로 버튼글씨넣기 */
      .btn-action::before {
        content: "🚩동작시작";
        font-size: 30px;
        color: #dd492e;
      }
      /* 체크박스 체크시 버튼형 라벨 변경하기 */
      #chkbx:checked + .btn-action {
        background-color: #43db6e;
        border: 5px solid rgb(7, 55, 24);
      }
      #chkbx:checked + .btn-action::before {
        content: "🏳‍🌈동작중~!";
        color: #435254;
      }
      /* 체크박스 숨기기 */
      #chkbx {
        display: none;
      }
      /* 체크박스 체크시 car-box이동애니 
      ->체크박스 체크시 다음 형제요소들 중 .ani-box의 자식
      #car-box 선택*/
      #chkbx:checked ~ .ani-box #car-box {
        /* 1.바깥으로 나감 */
        left: 100%;
        /* 2.배경이미지 변경 */
        background-image: url(./images/car2.png);
        /* 3.트랜지션*/ 
        transition: 
        /* 10초동안 같은 속도로 */
        10s linear, 
        /* 배경이미지 6초후 변경 */
        background-image .3s 6s;
      }
      /* 체크박스 체크시 바트박스 5.5초후 투명하게 변경하기 */
       #chkbx:checked ~ .ani-box #bart-box{
        /* 투명도 op- opacity: 0~1사잇값 
        (0은투명 1은 불투명 소숫점은 반투명) */
        opacity: 0;
        /* 트랜지션  :5.5초후 0.2초간 동작*/
        transition: .2s 5.5s
       }
    </style>
  </head>
  <body>
    <!-- 체크박스 -->
    <input type="checkbox" id="chkbx" />
    <!-- 라벨 -->
    <label for="chkbx" class="btn-action"></label>
    <!-- 바트심슨 자동차 타기 애니박스 -->
    <div class="ani-box">
      <!-- 자동차 박스 -->
      <div id="car-box"></div>
      <!-- 바트심슨 박스-->
      <div id="bart-box">
        <img src="./images/Bart_Simpson.png" alt="바트심슨" />
      </div>
    </div>
  </body>
</html>
