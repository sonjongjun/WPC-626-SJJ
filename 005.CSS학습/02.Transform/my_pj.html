    <style>
      /* 전체 배경넣기 */
      body {
        /* background: 색이반고윙/크 */
        /* background: 색 이미지 반복 고정 위치/크기 */
        /* 1. 이미지 */
        background-image: url(../images2/배경3.jpeg);
        /* 2. 반복여부 */
        background-repeat: no-repeat;
        /* 3. 고정: 배경이미지 화면고정 */
        background-attachment: fixed;
        /* 4.위치 : 가로(x)축 세로(y)축 
            가로값 - left(기본값), right center, 수치값
            세로값 - top, bottom, center(기본값), 수치값*/
        background-position: center;
        /* 5. 크기 : 가로(width), 세로(height)
            특이한 값들
            1) contain-> 배경이미지가 모두보임(비율맞게)
            2) cover -> 비율에 맞게 대상박스에 빈 공간이 없음
            3) 모두 채운후 비율없이 만드는 방법 100%, 100%*/
        background-size: cover;
      }

        border-radius: 50px;

        /* display: inline-block;

        line-height: 100px;

        /* 글자 테두리 */
        /* -webkit-text-stroke: 1px green ; */
        text-shadow: 2px 0 yellow, -2px 0 yellow, 0 2px yellow, 0 -2px yellow;
        /* position: absolute; */
      }
      /* 전체 부모박스 */
      .main-contents {
        /* 박스세팅 */
        max-width: 1500px;
        margin: 100px auto;
        border: 10px solid #cf0e0e;
        border-radius: 20px;
        padding: 20px;
        /* 기본적으로 박스 크기를 잡으면 그 크기는 컨텐트 영역의 크기임
보더와 패딩은 바깥쪽으로 생김 그래서 박스가 커진다
보더 패딩을 크기세팅에 포함시키려면
box-sizing:border-box 세팅해야함!!*/
        box-sizing: border-box;

        /* 겹쳐지는 부분 배경 흐리게 처리하기
-> 백드롭필터: 블러 */
        backdrop-filter: blur(3px);
      }
      /* 부모박스 가상요소 clear세팅(float때문에) */
      .main-contents::after {
        content: "";
        display: block;
        clear: both;
      }
      /* 캐릭터 박스 공통 */
      .main-contents > div {
        float: left;
        /* 5등분하기 */
        width: calc(100% / 5);
        padding-top: 15%;
        position: relative;
        text-align: center;
      }
      /* 캐릭터 이미지 공통*/
      .main-contents > div img {
        width: 200px;
        height: 200px;
        /* 원형 */
        border-radius: 50%;
        border: 5px solid rgb(194, 194, 33);

        /* 트랜지션 */
        transition: 0.6s;
        left: 50%;
        translate: -50%;
        top: 0;
      }
      /* 5번째 div이후 자식요소 마진탑주기 */
      .main-contents > div:nth-child(5) ~ div {
        /* 위쪽마진 */
        margin-top: 20px;
      }

  ***************************[ Transform 효과주기 ]***************************
  - 선택요소의 크기, 회전, 이동, 기울임
    등 변형을 하기위한 속성
  - 2D, 3D 지원됨

  1. rotateY(각도deg) - Y축회전
  - deg 는 각도의 단위(도:degree)

 *************************** [ 각도 단위 확장 ]***************************

  (3) rad: 라디안 (2π rad는 한 바퀴 회전)
  (4) turn: 턴 (1 turn은 한 바퀴 회전)*/

        right: 0;

        font-weight: bold;
        color: #ff0000;
        -webkit-text-stroke: 0.5px #f2ff00;
        font-size: 24px;

        /* 처음에 투명 opa */
        opacity: 0;

        /* 트랜지션 trs */
        transition: 0.4s 0.4s;
      }

      .main-contents > div:hover span {
        opacity: 1;
