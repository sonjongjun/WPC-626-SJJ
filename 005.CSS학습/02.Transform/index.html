<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>트랜스폼 기본연습!</title>
    <!-- 트랜스폼 샘플 사이트! -->
    <!-- https://tombap8.github.io/FED-RV-TOM-2024/002.HTML%ED%95%99%EC%8A%B5/05.Transform_PJ/index.html -->
    <style>
      /* 전체 배경넣기 */
      body {
        /* background: 색이반고윙/크 */
        /* background: 색 이미지 반복 고정 위치/크기 */
        /* 1. 이미지 */
        background-image: url(./images/bg-main.jpg);
        /* 2. 반복여부 */
        background-repeat: no-repeat;
        /* 3. 고정: 배경이미지 화면고정 */
        background-attachment: fixed;
        /* 4.위치 : 가로(x)축 세로(y)축 
            가로값 - left(기본값), right center, 수치값
            세로값 - top, bottom, center(기본값), 수치값*/
        background-position: center top;
        /* 5. 크기 : 가로(width), 세로(height)
            특이한 값들
            1) contain-> 배경이미지가 모두보임(비율맞게)
            2) cover -> 비율에 맞게 대상박스에 빈 공간이 없음
            3) 모두 채운후 비율없이 만드는 방법 100%, 100%*/
        background-size: cover;
      }
      /* 1. 제목 */
      .main-title {
        /* 박스세팅 */
        background-color: #00000094;
        border-radius: 50px;
        text-align: center;
        /* 글자세팅 */
        color: rgb(167, 225, 179);
        font-size: 50px;
        line-height: 100px;
        /* 글자 테두리 */
        /* -webkit-text-stroke: 1px green ; */
        text-shadow: 2px 0 green, -2px 0 green, 0 2px green, 0 -2px green;
      }
      /* 전체 부모박스 */
      .main-contents {
        /* 박스세팅 */
        max-width: 1500px;
        margin: 100px auto;
        border: 10px solid #5dc269;
        border-radius: 20px;
        padding: 20px;
        /* 기본적으로 박스 크기를 잡으면 그 크기는 컨텐트 영역의 크기임
보더와 패딩은 바깥쪽으로 생김 그래서 박스가 커진다
보더 패딩을 크기세팅에 포함시키려면
box-sizing:border-box 세팅해야함!!*/
        box-sizing: border-box;

        /* 겹쳐지는 부분 배경 흐리게 처리하기
-> 백드롭필터: 블러 */
        backdrop-filter: blur(3px);
      }
      /* 부모박스 가상요소 clear세팅(float때문에) */
      .main-contents::after {
        content: "";
        display: block;
        clear: both;
      }
      /* 캐릭터 박스 공통 */
      .main-contents > div {
        float: left;
        /* 5등분하기 */
        width: calc(100% / 5);
        /* 중앙정렬 */
        text-align: center;
      }
      /* 캐릭터 이미지 공통*/
      .main-contents > div img {
        width: 200px;
        height: 200px;
        /* 원형 */
        border-radius: 50%;

        /* 트랜지션 */
        transition: 0.6s;
      }
      /* 5번째 div이후 자식요소 마진탑주기 */
      .main-contents > div:nth-child(5) ~ div {
        /* 위쪽마진 */
        margin-top: 20px;
      }
      /* 
  ***************************[ Transform 효과주기 ]***************************
  - 선택요소의 크기, 회전, 이동, 기울임
    등 변형을 하기위한 속성
  - 2D, 3D 지원됨

  1. rotateY(각도deg) - Y축회전
  - deg 는 각도의 단위(도:degree)

 *************************** [ 각도 단위 확장 ]***************************
  (1) deg: 도 단위 (360 deg는 한 바퀴 회전)
  (2) grad: 그라디언트 (400 grad는 한 바퀴 회전)
  (3) rad: 라디안 (2π rad는 한 바퀴 회전)
  (4) turn: 턴 (1 turn은 한 바퀴 회전)*/
      #transform-box1:hover img {
        /* y축회전 tfry*/
        transform: rotateY(180deg);
        /* 동시효과중 필터주기 */
        filter: grayscale(70%);
        /******************************* CSS 필터 적용하기****************************
        : 필터속성은 흑백,흐림,세피아,명암,
        채도 등 출력이미지를 변경하고자 할때
        사용하는 속성
        (참고)
        https://www.w3schools.com/cssref/playit.php?filename=playcss_filter&preval=blur(5px) */
      }
      /* 2. rotateX(각도deg) - X축회전
                      - deg 는 각도의 단위(도:degree) */
      #transform-box2 img {
        /* x축 회전 미리 해놓기! */
        transform: rotateX(180deg);
        /* 필터블러 */
        filter: blur(2px);
      }
      /* 오버시 원상복귀 */
      #transform-box2:hover img {
        transform: rotateX(0deg);
        /* 필터블러없애기 */
        filter: blur(0px);
      }
      /* ***********************3. translateX(거리) - X축이동*************************
      - 단위 : px, % 등
      - 현재 위치로부터 이동
      - 기준점은 요소의 왼쪽
      - % 단위를 쓸경우 기준은 요소의 width값
      - 이동방향: + 오른쪽, -는 왼쪽*/
      #transform-box3:hover img {
        /* x축이동 tftx */
        transform: translateX(-50%);
        /* ->%단위 기준은 항상 자기자신의 크기*/
      }
      #transform-box4:hover img {
        /********************************************** 
    4. translateY(거리tfty) - Y축이동
    - 단위 : px, % 등
    - 현재 위치로부터 이동
    - 기준점은 요소의 윗쪽
    - % 단위를 쓸경우 기준은 요소의 height값
    - 이동방향: + 아랫쪽, -는 윗쪽
      **********************************************/
        transform: translateY(200%);
        /* ->%단위 기준은 항상 자기자신의 크기*/
      }
      #transform-box5:hover img {
        /********************************************** 
  5. translate(x축거리,y축거리) - X,Y축이동
  - 단위 : px, % 등
  - 현재 위치로부터 이동
  - 기준점은 요소의 윗쪽, 왼쪽선
  - % 단위를 쓸경우 기준은 요소의 
      width,height값
  - 이동방향: + 오른쪽/아랫쪽, -는 왼쪽/윗쪽
      **********************************************/
        /* transform: translate(-100%,-100%); */
        /****************************************************************
원래는 translate는 transform하위 세팅속성임
translate의 사용율이 높아짐에 따라 속성값으로 독립됨

[translate속성]
translate: 값 값; -> x,y축 이동설정값
translate: 값; -> x축 이동설정값
translate: 0,값; -> y축 이동설정값
****************************************************************/
        /* translate: -100%; ->x축이동 */
        /* translate: 0 -100%; ->y축이동 */
        translate: -100% -100%; /* -> x,y축 동시이동(중간에 ,하지말것!) */
        /* 투명도 조정 - opacity속성*/
        opacity: 0.5;
      }
      /* 이미지 회전축 변경하기 */
      #transform-box6 img {
        /************************************** 
       6. transform: rotate(각도deg) - 원형회전
       - 각도의 숫자가 양수이면 시계방향
       음수는 반시계방향
       - 기본회전축은 정중앙
       (변경가능: transform-origin)
   
       [ 트랜스폼 회전축 변경속성 ]
       transform-origin: 가로 세로;
       - 가로값 : left, right, center, 몇 px,몇%
       - 세로값 : top, bottom, center, 몇 px,몇%
       - 기본값 : 가로, 세로 center임! 
       **************************************/
        /* transform-origin:right; */
        transform-origin: 20% 20%;
      }
      #transform-box6:hover img {
        /* 원형회전 ->tfr */
        rotate: z -7200deg;

        /************************************************* 

[rotate 속성]

rotate : 각도; -> 평면회전
rotate : x 각도; -> x축회전
rotate : y 각도; -> y축회전
rotate : z 각도; -> z축회전

((참고: 축 회전 조합하기))
rotate : 숫자 숫자 숫자 각도
-> 숫자에 1을쓰면 순서대로 x,y,z축이다. 사용표시
-> 숫자에 0을 쓰면 순서대로 x,y,z축 미사용표시

ex) rotate: 1 1 0 45deg; x,y 축 동시 45도 회전
ex) rotate: 1 1 1 180deg; x,y,z축 동시 180도 회전

*************************************************/

        /* 트랜지션 시간 늘리기 */
        transition-duration: 15s;
      }
      #transform-box7:hover img {
        /*******************************************************************
7. transform: skew - x,y축 기울임
- skewX(각도deg), skewY(각도deg)
- skew(x축,y축)
- 각도가 양수/음수에 따라 기울임 방향이 달라짐
*******************************************************************/
        /* x축 skew */
        /* transform: skewX(30deg);*/
        /* y축 skew */
        transform: skewY(30deg);
      }

      #transform-box8:hover img {
        /******************************************** 
    8. transform: scale(x축배수, y축배수)
    - 값을 하나만쓰면 양방향 같은 값 셋팅
    - 배수가 1보다 크면 확대, 작으면 축소
    - scaleX(배수), scaleY(배수) - x,y별셋팅
    - 값이 0이면 사라짐
    -> 가끔 크기가 정해진 요소를 일정크기로
    축소, 확대해서 크기를 맞출때도 용이함!

[scale 속성]
scale: 값; -> 전체확대/축소
scale: 값 값; -> x,y 따로확대/축소
scale: 값 1; -> x축 확대/축소
scale: 1 값; -> y축 확대/축소


********************************************/
        scale: 2;
      }
      /************************************************* 

      9.복합적용하기
      transform: 속성1 속성2 속성3
      *************************************************/
      #transform-box9:hover img {
        transform: scale(5) translate(-200%, -100%) rotateX(1200deg)
          skewX(50deg) rotate(5300deg);
        /* 트랜지션 시간 늘리기 */
        transition-duration: 15s;
      }

      /* 10.자유효과주기 */
      #transform-box10 img {
        opacity: 0.5;
      }
      #transform-box10:hover img {
        transform: scale(3) rotateY(180deg) rotateX(7200deg);
        filter: invert(1);
        transition: 8s ease-in-out;
        opacity: 1;
      }

      /* 인트로 등장 애니메이션 설정하기 */
      /* animate를 배우기 전이므로 :hoverfmf 사용! */
      .main-contents {
        /* 오른쪽 바깥에 나가있게 세팅함 translate사용! */
        translate: 110%;
        /* 트랜지션 */
        transition: 0.8s ease-in-out 1s;
      }
      /* 오버시 등장 */
      body:hover .main-contents {
        translate: 0;
      }
      /* 뒤집히는 애니박스 */
      #transform-special {
        position: absolute;
        top: 20px;
        left: 20px;
        /* 부모는 보이는화면 */
      }
      /* 이미지가 겹치게 앱솔루트 세팅 */
      #transform-special img {
        position: absolute;
        width: 150px;
        height: 150px;
        /* 원형으로 만들기 */
        border-radius: 50%;
      }
      /*1. 첫번째 img자식 - 유정원본(돌아올때)*/
      #transform-special img:first-child {
        /* 처음에 돌려놓음(숨김) */
        transform: rotateY(90deg);
        /* 트랜지션 바로출발, 처음만 천천히*/
        transition: .4s ease-in
      }
      /*2. 첫번째 img자식 - 유정오버시 */
      #transform-special:hover img:first-child {
        /* 처음에 돌려놓음(숨김) */
        transform: rotateY(0deg);
        /* 트랜지션 보검 기다리기 / 그대로 받아서 끝에 천천히*/
        transition: .4s .4s ease-out
      }
      /*3. 마지막 img자식 - 보검원본(처음에보임)*/
      #transform-special img:last-child {
        transform: rotateY(0deg);
        /* 트랜지션 돌아올때 유정 기다리기
        그대로 받아서 끝에 천천히*/
        transition: .4s .4s ease-out
      }
      /*4
    . 마지막 img자식 - 보검오버시(숨겨짐)*/
      #transform-special:hover img:last-child {
        /* 오버시 90도로 숨겨짐 */
        transform: rotateY(90deg);
        /* 트랜지션 */
        transition: .4s ease-in
      }
    </style>
  </head>
  <body>
    <!-- 1. 제목 -->
    <h1 class="main-title">트랜스폼 연습</h1>

    <!-- 2. 뒤집히는 애니박스 -->
    <div id="transform-special">
      <img src="images/cast02.jpg" alt="캐릭터" />
      <img src="images/cast03.jpg" alt="캐릭터" />
    </div>

    <!-- 3. 컨텐츠 박스 -->
    <section class="main-contents">
      <!-- [] <-대괄호는 속성선택자
         ex) #transform-box$*10>img[src=images/cast0$.jpg alt=캐릭터]-->
      <div id="transform-box1">
        <img src="images/cast01.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box2">
        <img src="images/cast02.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box3">
        <img src="images/cast03.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box4">
        <img src="images/cast04.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box5">
        <img src="images/cast05.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box6">
        <img src="images/cast01.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box7">
        <img src="images/cast02.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box8">
        <img src="images/cast03.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box9">
        <img src="images/cast04.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box10">
        <img src="images/cast05.jpg" alt="캐릭터" />
      </div>
    </section>
  </body>
</html>
