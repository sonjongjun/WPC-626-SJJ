<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>심슨가족소개 애니</title>
    <!-- 심슨 메인 CSS -->
    <link rel="stylesheet" href="./css/simpson.css">
    <!-- 심슨 애니메이션 CSS -->
    <link rel="stylesheet" href="./css/simpson_ani.css">
</head>

<body>
    <h1 class="tit">My Space!</h1>

    <!-- 전체화면박스 -->
    <div class="house rbx">
        <!-- 1.심슨 -->
        <img src="./images/saturn.png" alt="토성" class="saturn">

        <!-- 2.말풍선 -->
        <div class="words">
            Hi! Everyone <br>
            Welcome to my space <br>
            This is My Space. <br>
            It's Fantastic! <br>
            I LOVE MY SPACE!!!
        </div>

        <!-- 3.마지 -->
        <img src="./images/moon.png" alt="달" class="moon">

        <!-- 4.리사 -->
        <img src="./images/sun.png" alt="해" class="sun">

        <!-- 5.메기 -->
        <img src="./images/superman.png" alt="슈퍼맨" class="s-man">

        <!-- 6.바트 -->
        <img src="./images/pluto.png" alt="명왕성" class="pluto">

    </div>

    <!-- TV이미지 -->
    <img src="./images/oldTVnew.png" alt="TV" id="tv">

</body></html>
