<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>descendant 선택자</title>
    <!-- jQuery library -->
    <script src="../jquery-3.6.3.min.js"></script>
    <style>
      body {
        font-size: 4vw;
      }
    </style>
    <script>
      $(function () {
        // 미션:
        // (1) 아래의 각 li에 미니언즈 이미지를 웹으로 찾아서 html로 넣고
        // '<img src="https://hercanberra.com.au/wp-content/uploads/2019/06/Minions_feature.jpg" alt="미니언즈">'
        // '<img src="https://www.partyrama.co.uk/wp-content/uploads/2017/06/minions-kevin-lifesize-cardboard-cutout-180cms-product-image.jpg" alt="미니언즈">'
        // '<img src="https://5.imimg.com/data5/XQ/KP/MY-40305254/kids-toy-500x500.jpg" alt="미니언즈">'
        // 이미지크기를 width: 100px로 고정한다.
        // (2) 각 이미지 클릭시 이미지크기가 클릭할때마다 10px씩 커지게함과
        // 동시에 한번은 오른쪽, 한번은 왼쪽으로 10도씩 기울어지게 애니메이션 하시오.
        //대상 :#first, #second, #third 각각
        // 메서드: html()
        $("#first").html(
          '<img src="https://hercanberra.com.au/wp-content/uploads/2019/06/Minions_feature.jpg" alt="미니언즈">'
        );
        $("#second").html(
          '<img src="https://www.partyrama.co.uk/wp-content/uploads/2017/06/minions-kevin-lifesize-cardboard-cutout-180cms-product-image.jpg" alt="미니언즈">'
        );
        $("#third").html(
          '<img src="https://5.imimg.com/data5/XQ/KP/MY-40305254/kids-toy-500x500.jpg" alt="미니언즈">'
        );
        // 모든 이미지크기를 width: 100px로 고정한다.
        $("img").css("width", "20vw");
        // 각 이미지 클릭시 이미지크기가 한번씩 클릭할때마다 1vw씩 점점 커지게함과
        // 동시에 한번은 오른쪽, 한번은 왼쪽으로 10도씩 이미지가 기울어지게 애니메이션 하시오.
        $("img").click(function () {
          // 기존 회전각도를 읽어오기
          let ang = $(this).css("rotate");
          console.log('각도:',$(this).css('rotate'));
          console.log('크기:',$(this).css('width'));
          // 아무것도 없을때는 'none'로 나옴
          // 이후에는 '10 deg'형식으로로 나옴
          // 만약 'none'거나 '-10deg' 이면 '10deg'로 바꾸기
          // 그렇지 않으면 -10deg로 바꾸기
          



          // 클릭된 이미지 CSS변경////////
          // 트랜지션 대신 애니메이션 주기
          // $(선택자).animate({속성:값},시간)
          $(this).animate({
            width: "+=1vw",
            rotate: ang == '10deg' ? '-10deg' : '10deg',
            
          },100);
          
        });
      });
    </script>
  </head>

  <body>
    <div id="container">
      <header>
        <h2>Welcome mySite</h2>
        <p>Lorem Ipsum is simply</p>
      </header>

      <nav>
        <ul class="list">
          <li id="first">One</li>
          <li id="second">Two</li>
          <li id="third">Three</li>
        </ul>
      </nav>

      <p>Lorem Ipsum is simply</p>
    </div>

    <!---------- jQuery code Start ---------->
    <script></script>
  </body>
</html>
