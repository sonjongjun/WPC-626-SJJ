<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 아카이브 사이트</title>
    <!-- 폰트어썸 CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- 1.상단영역 -->
    <div id="top-area">
      <section class="top-area inbox">
        <!-- 로고 파티션 -->
        <div class="part-box col-2">
          <img class="logo" src="./images/My_Logo2.png" alt="메인로고" />
        </div>
        <!-- 메뉴파티션 -->
        <div class="part-box col-8">
          <!-- GNB메뉴 -->
          <ul id="gnb">
            <li>
              <a href="#">Home</a>
            </li>
            <li>
              <a href="#">Traning</a>
            </li>
            <li>
              <a href="#">Shadowing</a>
            </li>
            <li>
              <a href="#">My Project</a>
            </li>
          </ul>
        </div>
        <!-- 깃허브 파티션 -->
        <div class="part-box col-2 git-box">
          <!-- 마이캐릭터 이미지 -->
           <a class="my-cha-link" href="#" title="나의 프로젝트 사이트 바로가기">
             <img src="./images/frog (2).png" alt="내 로고">
             <img src="./images/frog.png" alt="내 하트로고">
            </a>
             <!-- 깃허브 로고 링크 -->
          <a title="나의 깃허브 사이트 바로가기"
            class="fa-brands fa-github"
            href="https://github.com/sonjongjun"
            target="_blank"
          >
          </a>
        </div>
      </section>
    </div>

    <!-- 2.메인영역 -->
    <div id="main-area">
      <main class="main-area">
        <!-- 2-1. 자기소개박스 -->
        <section id="intro-box">
          <!-- 자기소개 속박스 -->
          <div class="intro-box inbox">
            <!-- 자기소개 글 박스 -->
            <div class="part-box col-4 txt-box">
              <h2>손종준</h2>
              <p>
                👋 안녕하세요! 서울에 거주 중인 웹퍼블리셔입니다.
                <br />
                HTML, CSS, JavaScript를 활용한 반응형 웹 구축에 능하며, 사용자
                경험을 고려한 세련된 UI 구현을 지향합니다. <br />
                웹 표준과 접근성을 중시하며, 디자인과 개발의 연결고리 역할을
                즐깁니다. <br />새로운 트렌드에 민감하고, 협업과 소통에 자신
                있습니다. 더 나은 웹을 위해 늘 배우고 성장하는 퍼블리셔가
                되겠습니다. 😊
                <br />
              </p>
            </div>
            <!-- 자기소개 이미지 박스 -->
            <div class="part-box col-8 img-box">
              <!-- 이미지박스 -->
              <div class="img-box">
                <img src="./images/worksbg.jpg" alt="내 이미지" />
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <!-- 3.하단영역 -->

    <div id="bottom-area">
      <footer class="bottom-area inbox"></footer>
    </div>
  </body>
</html>
